/* ============================== UTILITIES ============================== */

/* ============================== RENDERER ============================== */

/* Instanced part pool: every agent part is one slot in an InstancedMesh (object pooling, 1 draw call per part type) */
const BIG=new THREE.Sphere(new THREE.Vector3(),1e6);
class Inst{
  constructor(geo,mat,n,colored,parent=scene){
    this.m=new THREE.InstancedMesh(geo,mat,n); this.n=n; this.a=this.m.instanceMatrix.array; this.a.fill(0);

    if(colored){this.m.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(n*3).fill(1),3);this.c=this.m.instanceColor.array;this.m.instanceColor.setUsage(THREE.DynamicDrawUsage);}

  put(i,px,py,pz,fx,fz,sx,sy,sz){const a=this.a,o=i*16;a[o]=fx*sx;a[o+1]=0;a[o+2]=fz*sx;a[o+4]=0;a[o+5]=sy;a[o+6]=0;a[o+8]=-fz*sz;a[o+9]=0;a[o+10]=fx*sz;a[o+12]=px;a[o+13]=py;a[o+14]=pz;}
  hide(i){const a=this.a,o=i*16;a[o]=a[o+2]=a[o+5]=a[o+8]=a[o+10]=0;a[o+12]=a[o+14]=0;a[o+13]=-50;}
  col(i,r,g,b){const c=this.c,o=i*3;c[o]=r;c[o+1]=g;c[o+2]=b;}
  done(){this.m.instanceMatrix.needsUpdate=true;if(this.c)this.m.instanceColor.needsUpdate=true;}
}
/* Flat vertex-coloured quad batch for roads / markings */
class Batch{
  constructor(){this.p=[];this.c=[];}
  rect(cx,cz,fx,fz,hl,hw,y,col){               // centre, forward dir, half length, half width
    const rx=-fz,rz=fx,ax=cx-fx*hl-rx*hw,az=cz-fz*hl-rz*hw,bx=cx-fx*hl+rx*hw,bz=cz-fz*hl+rz*hw,
          ex=cx+fx*hl+rx*hw,ez=cz+fz*hl+rz*hw,dx=cx+fx*hl-rx*hw,dz=cz+fz*hl-rz*hw;
    this.p.push(ax,y,az,bx,y,bz,ex,y,ez, ax,y,az,ex,y,ez,dx,y,dz);
    for(let i=0;i<6;i++)this.c.push(col[0],col[1],col[2]);
  }
  box(x0,z0,x1,z1,y,col){this.rect((x0+x1)/2,(z0+z1)/2,1,0,(x1-x0)/2,(z1-z0)/2,y,col);}
  mesh(mat){
    const g=new THREE.BufferGeometry(),n=this.p.length/3,nm=new Float32Array(n*3);
    for(let i=0;i<n;i++)nm[i*3+1]=1;
    g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3));
    g.setAttribute('normal',new THREE.BufferAttribute(nm,3));
    return new THREE.Mesh(g,mat);
  }
}
/* Debug line buffer (raycasts, path nodes) */
const DBG_MAX=6000;
const dbgGeo=new THREE.BufferGeometry();
const dbgPos=new Float32Array(DBG_MAX*6), dbgCol=new Float32Array(DBG_MAX*6);
dbgGeo.setAttribute('position',new THREE.BufferAttribute(dbgPos,3).setUsage(THREE.DynamicDrawUsage));
dbgGeo.setAttribute('color',new THREE.BufferAttribute(dbgCol,3).setUsage(THREE.DynamicDrawUsage));
const dbgLines=new THREE.LineSegments(dbgGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.9,depthTest:false}));
dbgLines.frustumCulled=false; dbgLines.renderOrder=10; scene.add(dbgLines);
let dbgN=0;
function dline(x1,z1,x2,z2,r,g,b,y=1.0){
  if(dbgN>=DBG_MAX)return; const o=dbgN*6;
  dbgPos[o]=x1;dbgPos[o+1]=y;dbgPos[o+2]=z1;dbgPos[o+3]=x2;dbgPos[o+4]=y;dbgPos[o+5]=z2;
  dbgCol[o]=dbgCol[o+3]=r;dbgCol[o+1]=dbgCol[o+4]=g;dbgCol[o+2]=dbgCol[o+5]=b; dbgN++;
}
/* Spatial hash (8 m cells), rebuilt every step – all proximity / raycast / collision queries go through it */
const CELL=8, hash=new Map(), hashPool=[];
const hkey=(cx,cz)=>(cx+2048)*4096+(cz+2048);
function hashClear(){for(const a of hash.values()){a.length=0;hashPool.push(a);}hash.clear();}
function hashAdd(o){const k=hkey(Math.floor(o.x/CELL),Math.floor(o.z/CELL));let a=hash.get(k);if(!a){a=hashPool.pop()||[];hash.set(k,a);}a.push(o);}
const _near=[];
function hashNear(x,z,rad){                       // returns shared scratch array
  _near.length=0; const c0=Math.floor((x-rad)/CELL),c1=Math.floor((x+rad)/CELL),d0=Math.floor((z-rad)/CELL),d1=Math.floor((z+rad)/CELL);
  for(let cx=c0;cx<=c1;cx++)for(let cz=d0;cz<=d1;cz++){const a=hash.get(hkey(cx,cz));if(a)for(let i=0;i<a.length;i++)_near.push(a[i]);}
  return _near;
}
// distance from point to an agent's oriented box (peds: circle)
function obbDist(a,px,pz){
  const dx=px-a.x,dz=pz-a.z; if(a.kind==='ped')return hyp(dx,dz)-0.35;
  const lf=Math.abs(dx*a.fx+dz*a.fz)-a.len/2, lr=Math.abs(-dx*a.fz+dz*a.fx)-a.wid/2;
  return lf<=0&&lr<=0?Math.max(lf,lr):hyp(Math.max(lf,0),Math.max(lr,0));
}
// SAT overlap test for two oriented boxes (shrunk a little so that close passes are not crashes)
function obbHit(a,b,k=0.92){
  const dx=b.x-a.x,dz=b.z-a.z,ha=a.len/2*k,wa=a.wid/2*k,hb=b.len/2*k,wb=b.wid/2*k;
  const c=Math.abs(a.fx*b.fx+a.fz*b.fz),s=Math.abs(a.fx*b.fz-a.fz*b.fx);
  if(Math.abs(dx*a.fx+dz*a.fz)>ha+hb*c+wb*s)return false;
  if(Math.abs(-dx*a.fz+dz*a.fx)>wa+hb*s+wb*c)return false;
  if(Math.abs(dx*b.fx+dz*b.fz)>hb+ha*c+wa*s)return false;
  if(Math.abs(-dx*b.fz+dz*b.fx)>wb+ha*s+wa*c)return false;
  return true;
}
// hash raycast: nearest agent whose box is within `rad` of the ray. Returns {a,d} or null
function rayCast(ox,oz,dx,dz,maxD,self,rad=1.4,kind=null){
  for(let d=0;d<=maxD;d+=3){
    const px=ox+dx*d,pz=oz+dz*d,l=hashNear(px,pz,6);
    let best=null,bd=1e9;
    for(let i=0;i<l.length;i++){const a=l[i];if(a===self||(kind&&a.kind!==kind))continue;const q=obbDist(a,px,pz);if(q<rad&&q<bd){bd=q;best=a;}}
    if(best)return{a:best,d};
  }
  return null;
}
const stats={crashes:0,pedHits:0,redRuns:0,cutoffs:0,honks:0,bypasses:0,swerves:0,dodges:0,reroutes:0,rtor:0,reverses:0,stuck:0,spawned:0,exits:0,aebs:0,reward:0};
// reward shaping for RL fine-tuning and the benchmark "fitness". Per metre / per second / per event.
const RW={progress:.1,wait:.2,aeb:2,crash:20,ped:30,red:5,causeBrake:1.5,cutoff:2};
function reward(v,x){v.rw+=x;stats.reward+=x;}
let simT=0;
const evlog=[]; function logEv(type,info){evlog.push({t:+simT.toFixed(1),type,...info});if(evlog.length>300)evlog.shift();}

/* ============================== SHARED PROCEDURAL ASSETS ============================== */
const GEO={
  box:new THREE.BoxGeometry(1,1,1),
  wheel:new THREE.CylinderGeometry(.5,.5,1,10).rotateX(Math.PI/2),
  flat:new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2),
  disc:new THREE.CircleGeometry(1,20).rotateX(-Math.PI/2),
  head:new THREE.SphereGeometry(.5,8,6),
  oct:new THREE.CylinderGeometry(.45,.45,.06,8).rotateZ(Math.PI/2),
};
function canvasTex(sz,draw){const c=document.createElement('canvas');c.width=c.height=sz;draw(c.getContext('2d'),sz);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const glowTex=canvasTex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,240,200,1)');r.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=r;g.fillRect(0,0,s,s);});
const winRng=mulberry(77);
const winLit=[...Array(16)].map(()=>winRng()<.55);
const bldTex=canvasTex(128,(g)=>{g.fillStyle='#d2d2d2';g.fillRect(0,0,128,128);g.fillStyle='#33465c';for(let i=0;i<16;i++)g.fillRect((i%4)*32+7,(i>>2)*32+6,18,19);});
const bldEmi=canvasTex(128,(g)=>{g.fillStyle='#000';g.fillRect(0,0,128,128);for(let i=0;i<16;i++){if(!winLit[i])continue;g.fillStyle=i%3?'#ffd58a':'#cfe2ff';g.fillRect((i%4)*32+7,(i>>2)*32+6,18,19);}});
bldTex.wrapS=bldTex.wrapT=bldEmi.wrapS=bldEmi.wrapT=THREE.RepeatWrapping;
const MAT={
  paint:new THREE.MeshLambertMaterial(),
  glass:new THREE.MeshLambertMaterial({color:0x1b2530}),
  tyre:new THREE.MeshLambertMaterial({color:0x111214}),
  lamp:new THREE.MeshBasicMaterial(),
  shadow:new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.28,depthWrite:false}),
  glow:new THREE.MeshBasicMaterial({map:glowTex,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}),
  pole:new THREE.MeshLambertMaterial({color:0x3b4048}),
  stop:new THREE.MeshLambertMaterial({color:0xc4161c}),
  ground:new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95,metalness:0}),
  marks:new THREE.MeshLambertMaterial({vertexColors:true,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),
  bld:new THREE.MeshLambertMaterial({vertexColors:true,map:bldTex,emissiveMap:bldEmi,emissive:0xffffff,emissiveIntensity:0}),
  skin:new THREE.MeshLambertMaterial({color:0xe0b592}),
  wire:new THREE.MeshBasicMaterial({color:0x00ffaa,wireframe:true}),
};
const VT=[
  {n:'car',len:4.4,wid:1.85,bh:.75,ch:.6,cl:.5,cx:-.15,wr:.33,p:.60},
  {n:'suv',len:4.8,wid:2.0,bh:.95,ch:.75,cl:.62,cx:-.2,wr:.4,p:.82},
  {n:'van',len:5.6,wid:2.1,bh:1.2,ch:.9,cl:.7,cx:-.6,wr:.38,p:.94},
  {n:'truck',len:8.2,wid:2.5,bh:1.3,ch:1.7,cl:.72,cx:-.9,wr:.5,p:1},
];
const CAR_COLS=[[.82,.82,.85],[.12,.12,.14],[.55,.57,.6],[.7,.1,.1],[.1,.25,.6],[.9,.9,.9],[.2,.4,.25],[.85,.6,.1],[.35,.2,.5],[.6,.75,.85]];
const pickType=r=>VT.find(t=>r<t.p);
function mkVehParts(n,parent){return{
  body:new Inst(GEO.box,MAT.paint,n,true,parent), cabin:new Inst(GEO.box,MAT.glass,n,false,parent), wheel:new Inst(GEO.wheel,MAT.tyre,n*4,false,parent),
  head:new Inst(GEO.box,MAT.lamp,n*2,true,parent), tail:new Inst(GEO.box,MAT.lamp,n*2,true,parent), ind:new Inst(GEO.box,MAT.lamp,n*4,true,parent),
  shadow:new Inst(GEO.flat,MAT.shadow,n,false,parent), glow:new Inst(GEO.flat,MAT.glow,n,false,parent)};}
let nightF=0, blinkOn=true;
function placeVeh(ps,i,o){
  const t=o.type,fx=o.fx,fz=o.fz,rx=-fz,rz=fx,x=o.x,z=o.z,sh=o.shake||0,gy=t.wr*.6;
  ps.body.put(i,x,gy+t.bh/2+sh,z,fx,fz,t.len,t.bh,t.wid); ps.body.col(i,o.col[0],o.col[1],o.col[2]);
  ps.cabin.put(i,x+fx*t.cx,gy+t.bh+t.ch/2+sh,z+fz*t.cx,fx,fz,t.len*t.cl,t.ch,t.wid*.88);
  ps.shadow.put(i,x,.05,z,fx,fz,t.len*1.12,1,t.wid*1.2);
  const hl=t.len/2,hw=t.wid/2,lit=nightF>.3&&!o.parked;
  for(let q=0;q<4;q++){
    const lx=(q<2?1:-1)*t.len*.32,lz=(q&1?1:-1)*(hw-.12);
    ps.wheel.put(i*4+q,x+fx*lx+rx*lz,t.wr,z+fz*lx+rz*lz,fx,fz,t.wr*2,t.wr*2,.28);
    const ix=(q<2?1:-1)*hl,iz=(q&1?1:-1)*(hw-.12),on=blinkOn&&(o.ind===2||(o.ind===1&&(q&1))||(o.ind===-1&&!(q&1)));

/* ============================== WORLD GENERATION ============================== */
let world=null;
// lateral offset (m, to the right of the road centre line) of fractional lane index lf: -1 = left pocket, 0..L-1 through lanes, L = right-turn bay
const laneOff=(L,lf)=>lf<-1?(lf+1)*LW:lf<0?lerp(0,MED+LW/2,lf+1):lf<=L-1?MED+(lf+.5)*LW:lerp(MED+(L-.5)*LW,MED+L*LW+STRIP/2,Math.min(lf-(L-1),1));
const C_ASPH=[.17,.18,.2],C_MED=[.22,.22,.21],C_SW=[.56,.56,.54],C_LOT=[.4,.42,.38],C_PARK=[.24,.42,.22],C_WHT=[.92,.92,.92],C_YEL=[.95,.74,.1],C_GRASS=[.2,.3,.19];

function buildWorld(){
  if(world){scene.remove(world.group);world.group.traverse(o=>{if(o.geometry&&!Object.values(GEO).includes(o.geometry))o.geometry.dispose();if(o.isInstancedMesh)o.dispose();});}
  const N=P.gridX,M=P.gridY,Lv=P.lanesNS,Lh=P.lanesEW,HWv=MED+Lv*LW+STRIP,HWh=MED+Lh*LW+STRIP;
  const rng=mulberry(1234+N*31+M*17+Lv*5+Lh*3), group=new THREE.Group(); scene.add(group);
  const w=world={N,M,Lv,Lh,HWv,HWh,group,nodes:new Map(),real:[],segs:[],entries:[],walkEdges:[],parked:[],blocks:[]};
  const nx=i=>(i-N/2)*SP, nz=j=>(j-M/2)*SP; w.nx=nx; w.nz=nz;
  const nodeAt=(i,j)=>{const key=i+','+j;let n=w.nodes.get(key);
    if(!n){n={i,j,x:nx(i),z:nz(j),real:i>=0&&i<=N&&j>=0&&j<=M,in:[],out:[],box:[],q:[],id:w.nodes.size,curves:new Map()};w.nodes.set(key,n);if(n.real)w.real.push(n);}return n;};
  for(let i=0;i<=N;i++)for(let j=0;j<=M;j++)nodeAt(i,j);

/* ============================== JUNCTION GEOMETRY, SIGNALS & RIGHT-OF-WAY ============================== */
function getCurve(n,k,lane,turn){                 // path through junction n for approach heading k from integer lane
  const key=(k*8+lane+1)*3+TI[turn]; let c=n.curves.get(key); if(c)return c;
  const si=n.in[k],so=n.out[turn==='S'?k:turn==='R'?(k+1)%4:(k+3)%4];
  const ol=turn==='S'?clamp(lane,0,so.L-1):turn==='L'?0:so.L-1;
  const o0=laneOff(si.L,lane),o2=laneOff(so.L,ol);

    if(i)cum[i]=cum[i-1]+hyp(pts[i*2]-pts[i*2-2],pts[i*2+1]-pts[i*2-1]);}
  c={pts,cum,len:cum[NP-1],ol,so,k,turn,lane}; n.curves.set(key,c); return c;
}
function curvePt(c,u,out){
  const n=c.cum.length;let i=1;while(i<n-1&&c.cum[i]<u)i++;
  const a=i-1,l=c.cum[i]-c.cum[a],f=clamp((u-c.cum[a])/l,0,1),p=c.pts;
  out.x=lerp(p[a*2],p[i*2],f);out.z=lerp(p[a*2+1],p[i*2+1],f);out.tx=(p[i*2]-p[a*2])/l;out.tz=(p[i*2+1]-p[a*2+1])/l;return out;
}
// 12x12 movement conflict matrix (approach*3 + L/S/R), derived geometrically from the sampled curves; identical for all junctions
function buildConflicts(n){
  if(world.conf){n.conf=world.conf;return;}
  const mvCurves=(k,t)=>{const L=n.in[k].L;return t===0?[getCurve(n,k,-1,'L')]:t===2?[getCurve(n,k,L,'R')]:[...Array(L)].map((_,l)=>getCurve(n,k,l,'S'));};
  const conf=[...Array(12)].map(()=>Array(12).fill(false)),cu=[...Array(12)].map(()=>Array(12).fill(0));   // cu[a][b]: distance along a after which it has cleared b
  for(let a=0;a<12;a++)for(let b=a+1;b<12;b++){
    if((a/3|0)===(b/3|0))continue;
    for(const ca of mvCurves(a/3|0,a%3))for(const cb of mvCurves(b/3|0,b%3))
      for(let i=0;i<ca.cum.length;i++)for(let j=0;j<cb.cum.length;j++)if(hyp(ca.pts[i*2]-cb.pts[j*2],ca.pts[i*2+1]-cb.pts[j*2+1])<2.6){
        conf[a][b]=conf[b][a]=true;cu[a][b]=Math.max(cu[a][b],ca.cum[i]);cu[b][a]=Math.max(cu[b][a],cb.cum[j]);}

// is the junction still occupied by a vehicle that has not yet passed its conflict point with movement mv?
function boxBusy(n,mv,v,c){
  for(const w of n.box){if(w===v||!n.conf[mv][w.mv])continue;
    if(c&&w.mode==='junc'&&w.curve.so===c.so&&w.curve.ol!==c.ol)continue;      // it merges into a different lane of the road being entered
    if(w.mode==='junc'?w.u-w.len/2<world.cu[w.mv][mv]+1.5:w.seg.to===n)return true;}

/* NEMA dual-ring controller. Group 0 = E-W (phases 1,2,5,6), group 1 = N-S (3,4,7,8).

function sigStart(n){
  const ax=n.g===0?[1,3]:[0,2], four=P.sigMode[0]==='4';
  const dem=k=>n.in[k].vehs.some(v=>v.turn==='L'&&n.in[k].len-v.s<48);
  n.ld[0]=four?7:dem(ax[1])?8:0; n.ld[1]=four?7:dem(ax[0])?8:0;
  const ls=Math.max(n.ld[0],n.ld[1]); n.W0=ls>0?ls+4:0;

function sigUpdate(n,dt){
  n.t+=dt; if(n.t>=n.G+5){n.g^=1;sigStart(n);}
  const t=n.t,ax=n.g===0?[1,3]:[0,2];
  for(let k=0;k<4;k++){n.st[k]='R';n.sl[k]='R';n.ped[k]='D';}
  for(let r=0;r<2;r++){
    const ka=ax[r],kb=ax[1-r],Lg=n.ld[r],ls=Lg>0?Lg+4:0;
    n.st[ka]=t<ls?'R':t<n.G?'G':t<n.G+3.5?'Y':'R';

}
function updateNodes(dt){
  for(const n of world.real){

function drawSignals(){

    for(let k=0;k<4;k++){

      w.lamps.col(b*4,st==='R'?1:.14,st==='R'?.06:.02,.02); w.lamps.col(b*4+1,st==='Y'?1:.14,st==='Y'?.75:.1,0); w.lamps.col(b*4+2,.03,st==='G'?1:.14,st==='G'?.35:.05);
      const lc=sl==='G'?[.1,1,.35]:sl==='R'?[1,.06,.02]:(sl==='Y'||fl)?[1,.75,0]:[.16,.1,0];
      w.lamps.col(b*4+3,lc[0],lc[1],lc[2]);

/* ---------- right-of-way decisions ---------- */
// critical gap; in AI / RL mode a committed AGGRESSIVE_NUDGE accepts 20 % shorter gaps (still checked, still under AEB)
const tcOf=(v,base)=>{const p=aiP(v),t0=(base+.45*(Math.max(world.Lv,world.Lh)-1)-1.6*v.ag)*W.gf*(v2on()?asF(v):p&&p[2]>=.5?.8:1);return Math.max(2.2,t0*(v.sloppy?.6:1)-Math.min(.06*v.waitT,.3*t0));};   // critical gap (s): shrinks with aggressiveness, impatience and misjudgement
function willEnter(n,kb,w){

  if(n.type==='sig'){const st=w.turn==='L'?n.sl[kb]:n.st[kb];return st==='G'||(st==='Y'&&w.v>4)||((st==='F'||st==='R')&&w.go&&w.v>1);}

function gapClear(v,tc,c){                          // c: own curve for right turns -> only traffic bound for the same exit lane counts

  for(let kb=0;kb<4;kb++){ if(kb===k)continue; const sb=n.in[kb];

   v2  strategic network (20 inputs -> intent, turn, lane preference, assertiveness, value): PPO from random weights, no demonstrations.

  queueFill:'stopped cars x 7.5 m / (segment length x lanes), capped at 1',signalTimerS:'signed seconds / 30: + green remaining, - red remaining',

const qFill=sg=>{let n=0;for(const w of sg.vehs)if(w.v<.5)n++;return Math.min(1,n*7.5/(sg.len*sg.L));};      // how full of stopped cars a segment is

function features2(v,b,o){                         // inputs 12..19 (strategic): exit queues, signal timer, lane queues, own speed

        say(`PPO round ${round}: training (${u} updates, best ${pct()}% of IDM, target ${P.target}%, ${mins()} min)`);
        P.aiMode=MODES[5];b.train2=true;b.worker.postMessage({type:'rlReset'});reset();
        const okRun=await drive(RL_ROUND_T);b.train2=false;if(!okRun)throw 0;
        const w=brainWait('model');b.worker.postMessage({type:'getModel',version:2});await w;
        await test('PPO'+round);
        continue;
      }
      say(`RL round ${round}: fine-tuning (best ${pct()}% of IDM, target ${P.target}%, ${mins()} min)`);
      P.aiMode=MODES[3];b.worker.postMessage({type:'rlReset'});b.worker.postMessage({type:'rlConfig',lr});reset();
      if(!await drive(RL_ROUND_T))throw 0;
      const w=brainWait('model');b.worker.postMessage({type:'getModel'});await w;
      if(!await test('RL'+round))lr=Math.max(5e-5,lr*.6);          // RL made it worse: rolled back, smaller steps next time
      let any=false;
      for(let k=1;k<=3;k++){                           // auto-adjust the output biases, one intent at a time
        if(await confirmed())break;
        const m=JSON.parse(JSON.stringify(best.model));m.biases[2][k]+=sign[k]*delta;await load(m);
        if(await test(`${sign[k]>0?'more':'less'} ${PROBE_NAMES[k]} (${delta.toFixed(1)})`))any=true;else sign[k]=-sign[k];
      }
      if(!any)delta=Math.max(.3,delta*.6);
    }
    await report(won()&&await holdout());             // final verdict (cached if the best weights were already confirmed)
  }catch(x){
    if(x!==0)throw x;
    b.train2=false;b.pipeStop=false;                  // cancelled: still report how good the best weights are (cancel again to skip)
    try{if(best&&target&&(!v2||greedy))await report(false,true);else msg(`${tag} cancelled`,4);}
    catch(y){if(y!==0)throw y;if(best)await load(best.model);msg(`${tag} cancelled - best weights so far are live and saved`,5);}
  }finally{b.pipe='';b.pipeStop=false;b.train2=false;benchEnd(keep);}
}

function reroll(){for(const v of vehs){v.ag=clamp(P.aggrMean+gauss()*P.aggrSpread,.1,1);v.v0f=.82+.42*v.ag+rr(-.05,.05);v.T=1.9-1.15*v.ag;v.amax=1.3+1.6*v.ag;v.b=2+1.6*v.ag;v.s0=2.2-.7*v.ag;}}
function reset(){
  select(null); camMode='god'; orbit.enabled=true; player.car.active=player.ped.active=false;
  while(vehs.length)removeVeh(vehs[vehs.length-1]); while(peds.length)removePed(peds[peds.length-1]);
  hashClear(); buildWorld(); lastBulb=-1;
  for(const n of world.real)if(n.type==='sig'){const t=n.t;sigStart(n);n.t=t%n.G;sigUpdate(n,0);}
  seedTraffic(); for(let i=0;i<Math.min(P.maxPeds*.5,P.pedRate*1.2);i++)spawnPed();
  for(const k in stats)stats[k]=0; simT=0;
  const sz=Math.max(world.N,world.M)*SP; orbit.target.set(0,0,0); camera.position.set(sz*.25,sz*.55+60,sz*.75+60); updHelp(); updHud(fps);
}
let frame=0;
function step(dt){
  simT+=dt; W=WX[P.weather];
  hashClear(); for(const v of vehs)hashAdd(v); for(const p of peds)hashAdd(p); for(const o of world.parked)hashAdd(o);
  if(player.car.active)hashAdd(player.car); if(player.ped.active)hashAdd(player.ped);
  updateNodes(dt); spawnTraffic(dt); spawnPeds(dt);
  for(let i=vehs.length-1;i>=0;i--){const v=vehs[i];if(!v)continue;
    // temporal LOD: cars beyond two blocks run the full driver model at 15 Hz and are moved by linear kinematics in between
    if(P.lod&&!v.near&&v!==sel){if((frame+v.id)&3){v.x+=v.vx*dt;v.z+=v.vz*dt;}else updVeh(v,dt*4);}else updVeh(v,dt);}
  for(let i=peds.length-1;i>=0;i--){const p=peds[i];if(p)updPed(p,dt);}
  if(player.car.active)updPlayerCar(dt); if(player.ped.active)updPlayerPed(dt);
  if(++frame%3===0){
    const f=focusPt(); for(const v of vehs)v.near=hyp(v.x-f.x,v.z-f.z)<2*SP;        // spatial LOD: two blocks around the camera focus / player
    if(!brainTick()||P.headless)collide(); else playerCollide();                    // collisions run in the worker unless it is unavailable or lagging
  }
}
let last=performance.now(),acc=0,fpsN=0,fpsT=0,fps=60;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.1); last=now;
  if(!P.pause){
    if(P.headless){const t0=performance.now();let n=0;while(performance.now()-t0<15){step(1/60);n++;}brain.tps=Math.round(n/Math.max(dt,.004));}   // fast-forward: physics only
    else{acc+=dt*P.timeScale;let n=0;while(acc>=1/60&&n<8){step(1/60);acc-=1/60;n++;}if(n===8)acc=0;}
  }
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.display='none';}
  if(!P.headless){updEnv(dt); updCamera(dt); drawAgents(); drawSignals(); drawDebug(); updParticles(dt);
    renderer.render(scene,camera);}
  fpsN++;fpsT+=dt;if(fpsT>=.25){fps=Math.round(fpsN/fpsT);fpsN=0;fpsT=0;updHud(fps);}
}
