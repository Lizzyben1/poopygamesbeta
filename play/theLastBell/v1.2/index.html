<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Last Bell</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Three.js via ES Modules (CDN) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud">
    <!-- Cutscene letterbox (first, so the dialogue box always draws over it) -->
    <div id="letterbox"><div class="bar top"></div><div class="bar bottom"></div></div>

    <div id="crosshair"><span></span><span></span></div>

    <div id="objective-banner">
      <div id="objective-label">OBJECTIVE</div>
      <div id="objective-text">Pack your bag &amp; prep for XC practice.</div>
    </div>

    <div id="interact-prompt" class="hidden">
      <span class="key">E</span>
      <span id="interact-label">Interact</span>
    </div>

    <div id="stealth-meter" class="hidden">
      <div id="stealth-icon">&#9673;</div>
      <div id="stealth-bar-track"><div id="stealth-bar-fill"></div></div>
    </div>

    <div id="flashlight-indicator" class="hidden">
      FLASHLIGHT <span id="flashlight-state">OFF</span>
    </div>

    <div id="dialogue-box" class="hidden">
      <div id="dialogue-speaker"></div>
      <div id="dialogue-text"></div>
    </div>

    <div id="message-toast" class="hidden"></div>
  </div>

  <!-- ============ Title screen / chapter select / pause (pointer-lock overlay) ============ -->
  <div id="start-overlay">
    <div id="start-panel">
      <h1>THE LAST BELL</h1>
      <div id="legend-badge" class="hidden">&#9733; HALL LEGEND &#9733;</div>
      <h2 id="menu-subtitle" class="hidden"></h2>

      <div id="main-menu" class="menu">
        <button class="menu-btn" id="play-btn">PLAY</button>
        <button class="menu-btn menu-secondary" id="chapters-btn">CHAPTER SELECT</button>
        <button class="menu-btn menu-secondary" id="achievements-btn">ACHIEVEMENTS</button>
        <button class="menu-btn menu-secondary" id="settings-btn">SETTINGS</button>
        <button class="menu-btn menu-secondary hard-toggle hidden" data-hard-toggle>HARD MODE: OFF</button>
        <button class="menu-btn menu-secondary sandbox-toggle hidden" data-sandbox-toggle>SANDBOX: INFINITE AMMO + GOD MODE OFF</button>
      </div>

      <!-- (The settings panel below moves in here when it's opened from the title screen.) -->
      <div id="settings-menu" class="menu hidden">
        <button class="menu-btn menu-secondary" id="settings-back">BACK</button>
      </div>

      <div id="chapter-menu" class="menu hidden">
        <button class="menu-btn chapter-btn" data-chapter="1">
          <span class="chapter-num">CHAPTER 1</span><span class="chapter-name">The Last Bell</span>
        </button>
        <button class="menu-btn chapter-btn" data-chapter="2">
          <span class="chapter-num">CHAPTER 2</span><span class="chapter-name">Below the Oak</span>
        </button>
        <button class="menu-btn chapter-btn" data-chapter="3">
          <span class="chapter-num">CHAPTER 3</span><span class="chapter-name">Lights Out</span>
        </button>
        <button class="menu-btn chapter-btn secret-btn locked" id="secret-btn" aria-label="Secret Chapter: Overtime">
          <span class="chapter-num">SECRET CHAPTER</span><span class="chapter-name">Overtime</span>
          <span class="chapter-note" id="secret-note">LOCKED &middot; BEAT THE GAME</span>
        </button>
        <button class="menu-btn menu-secondary hard-toggle hidden" data-hard-toggle>HARD MODE: OFF</button>
        <button class="menu-btn menu-secondary sandbox-toggle hidden" data-sandbox-toggle>SANDBOX: INFINITE AMMO + GOD MODE OFF</button>
        <button class="menu-btn menu-secondary" id="chapters-back">BACK</button>
      </div>

      <div id="secret-menu" class="menu hidden">
        <button class="menu-btn chapter-btn" data-secret="1">
          <span class="chapter-num">OVERTIME &middot; PART 1</span><span class="chapter-name">The Vanishing at the Track</span>
        </button>
        <button class="menu-btn chapter-btn" data-secret="2">
          <span class="chapter-num">OVERTIME &middot; PART 2</span><span class="chapter-name">Sudden Death</span>
        </button>
        <button class="menu-btn menu-secondary" id="secret-back">BACK</button>
      </div>

      <div id="pause-menu" class="menu hidden">
        <button class="menu-btn" id="resume-btn">RESUME</button>
        <div id="settings-panel" class="settings-panel">
          <div class="setting-row">
            <div class="setting-head"><label for="sens-slider">MOUSE SENSITIVITY</label><output id="sens-value" for="sens-slider">1.00x</output></div>
            <input type="range" id="sens-slider" min="0.2" max="3" step="0.05" value="1" />
          </div>
          <div class="setting-row">
            <div class="setting-head"><label for="vol-slider">MASTER VOLUME</label><output id="vol-value" for="vol-slider">80%</output></div>
            <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.8" />
          </div>
          <div class="setting-toggles">
            <button class="menu-btn menu-secondary setting-toggle" id="bob-toggle">HEAD BOB: ON</button>
            <button class="menu-btn menu-secondary setting-toggle" id="fullscreen-btn">FULLSCREEN: OFF</button>
          </div>
        </div>
        <button class="menu-btn menu-secondary" id="quit-btn">QUIT TO MAIN MENU</button>
      </div>

      <p class="controls-hint">
        <span><b>WASD</b> Move</span>
        <span><b>Mouse</b> Look</span>
        <span><b>Shift</b> Sprint</span>
        <span><b>C</b> Crouch</span>
        <span><b>E</b> Interact / Hide</span>
        <span><b>F</b> Flashlight</span>
        <span><b>LMB</b> Fire</span>
        <span><b>R</b> Reload</span>
        <span><b>RMB</b> Throw / Guard</span>
        <span><b>Sprint + C</b> Slide</span>
        <span><b>Space</b> Break free</span>
        <span><b>Hold E</b> Hack</span>
        <span><b>Esc</b> Pause</span>
      </p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
